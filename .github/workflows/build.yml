name: Build Multi Tool Remote

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # This repo ships only lib/ + pubspec.yaml (no android/ios folders).
      # `flutter create .` scaffolds the missing platform folders in place
      # without touching lib/ or pubspec.yaml.
      - name: Scaffold platform folders
        run: flutter create --platforms=android,ios --org com.zsmultitool --no-pub .

      - name: Patch Android project (manifest, audio, compileSdk, Kotlin)
        run: python3 scripts/patch_android.py

      - run: flutter pub get

      # Regenerates android/app/src/main/res/mipmap-*/ic_launcher.png (and
      # adaptive icon layers) from assets/icon/icon.png. Needed every run
      # since android/ is scaffolded fresh above, not committed.
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: multi-tool-remote-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold platform folders
        run: flutter create --platforms=android,ios --org com.zsmultitool --no-pub .

      - run: flutter pub get

      # Podfile may not exist until after pub get on newer Flutter templates.
      - name: Patch iOS project (Info.plist, pods, signing)
        run: python3 scripts/patch_ios.py

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # flutter build ios --no-codesign still runs a pre-flight signing check
      # on some Flutter stable versions. Generate config + pods, then build
      # with xcodebuild and signing fully disabled (unsigned sideload IPA).
      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --config-only
          # Re-apply Podfile patch if config-only created it, then reinstall pods.
          python3 scripts/patch_ios.py --podfile-only
          cd ios && pod install && cd ..
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build
          mkdir -p build/ios/iphoneos
          rsync -a \
            build/ios-derived/Build/Products/Release-iphoneos/Runner.app \
            build/ios/iphoneos/

      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app
          zip -r MultiToolRemote-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: multi-tool-remote-ipa-unsigned
          path: build/ios/iphoneos/MultiToolRemote-unsigned.ipa
