name: Build Multi Tool Remote

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # This repo ships only lib/ + pubspec.yaml (no android/ios folders).
      # `flutter create .` scaffolds the missing platform folders in place
      # without touching lib/ or pubspec.yaml.
      - name: Scaffold platform folders
        run: flutter create --platforms=android,ios --org com.zsmultitool .

      # audio_service (Music tab) needs two changes to the generated
      # AndroidManifest.xml that flutter create can't know about — a
      # foreground-service permission set, and pointing the launcher
      # activity at the plugin's own AudioServiceActivity (so its
      # FlutterEngine/MediaBrowserService wiring works with zero custom
      # Kotlin — MainActivity.kt is unused). Since android/ is scaffolded
      # fresh every run rather than committed, this has to be patched in
      # CI each time rather than hand-edited once.
      - name: Patch AndroidManifest.xml for audio_service
        run: |
          python3 - <<'PY'
          import re

          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              xml = f.read()

          perms = (
              '    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n'
          )
          xml = re.sub(r'(<manifest[^>]*>\n)', r'\1' + perms, xml, count=1)

          xml = xml.replace(
              'android:name=".MainActivity"',
              'android:name="com.ryanheise.audioservice.AudioServiceActivity"',
          )

          with open(path, "w") as f:
              f.write(xml)
          print("Patched AndroidManifest.xml for audio_service")
          PY

      - run: flutter pub get

      # file_picker pulls in flutter_plugin_android_lifecycle, which now
      # requires compileSdk 36+. `flutter create` on the Flutter version
      # this CI installs still scaffolds `compileSdk = flutter.compileSdkVersion`,
      # which currently resolves lower than that — so the build fails at
      # :file_picker:checkReleaseAarMetadata. Same story as the manifest
      # patch above: android/ isn't committed, so this has to be patched
      # fresh each run rather than hand-edited once.
      - name: Patch Android compileSdk (file_picker needs 36+)
        run: |
          python3 - <<'PY'
          import re

          path = "android/app/build.gradle.kts"
          with open(path) as f:
              gradle = f.read()

          gradle, n = re.subn(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              gradle,
          )
          if n == 0:
              raise SystemExit(
                  f"Couldn't find 'compileSdk = flutter.compileSdkVersion' in "
                  f"{path} — the flutter create template may have changed; "
                  "update this patch to match its current compileSdk line."
              )

          with open(path, "w") as f:
              f.write(gradle)
          print(f"Patched compileSdk -> 36 in {path}")
          PY

      # Regenerates android/app/src/main/res/mipmap-*/ic_launcher.png (and
      # adaptive icon layers) from assets/icon/icon.png. Needed every run
      # since android/ is scaffolded fresh above, not committed.
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: multi-tool-remote-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold platform folders
        run: flutter create --platforms=android,ios --org com.zsmultitool .

      # audio_service (Music tab) needs background audio mode declared in
      # Info.plist — same reasoning as the Android manifest patch above:
      # ios/ is scaffolded fresh every run, so this can't just be
      # hand-edited once and committed.
      - name: Patch Info.plist for background audio
        run: |
          python3 - <<'PY'
          path = "ios/Runner/Info.plist"
          with open(path) as f:
              plist = f.read()

          block = (
              "\t<key>UIBackgroundModes</key>\n"
              "\t<array>\n"
              "\t\t<string>audio</string>\n"
              "\t</array>\n"
          )
          plist = plist.replace("<dict>\n", "<dict>\n" + block, 1)

          with open(path, "w") as f:
              f.write(plist)
          print("Patched Info.plist for background audio")
          PY

      # AirPrint discovery (Notes tab print button, via the `printing`
      # package) goes over Bonjour/mDNS on the local network. Since iOS
      # 14, that requires the app to declare which Bonjour service types
      # it uses and why — without these two keys, iOS blocks the local
      # network access silently (no permission prompt, no error, printer
      # list just stays empty), which is exactly what an HP printer not
      # showing up looks like. `_ipp._tcp`/`_ipps._tcp` are the standard
      # IPP printing service types that AirPrint-capable printers
      # (including HP's) advertise themselves under.
      - name: Patch Info.plist for AirPrint discovery
        run: |
          python3 - <<'PY'
          path = "ios/Runner/Info.plist"
          with open(path) as f:
              plist = f.read()

          block = (
              "\t<key>NSLocalNetworkUsageDescription</key>\n"
              "\t<string>Used to find printers on your Wi-Fi network so notes can be printed.</string>\n"
              "\t<key>NSBonjourServices</key>\n"
              "\t<array>\n"
              "\t\t<string>_ipp._tcp</string>\n"
              "\t\t<string>_ipps._tcp</string>\n"
              "\t</array>\n"
          )
          plist = plist.replace("<dict>\n", "<dict>\n" + block, 1)

          with open(path, "w") as f:
              f.write(plist)
          print("Patched Info.plist for AirPrint discovery")
          PY

      - run: flutter pub get

      # Regenerates ios/Runner/Assets.xcassets/AppIcon.appiconset/ from
      # assets/icon/icon.png. Needed every run since ios/ is scaffolded
      # fresh above, not committed.
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # --no-codesign: no Apple Developer account or Mac needed. Produces
      # an unsigned Runner.app, which is exactly what jailbroken sideload
      # tools (AppSync Unified / TrollStore / Filza install) expect.
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      # Package Runner.app into a proper IPA: Payload/Runner.app zipped up.
      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/Runner.app
          zip -r MultiToolRemote-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: multi-tool-remote-ipa-unsigned
          path: build/ios/iphoneos/MultiToolRemote-unsigned.ipa
