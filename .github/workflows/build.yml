name: Build Multi Tool Remote

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # This repo ships only lib/ + pubspec.yaml (no android/ios folders).
      # `flutter create .` scaffolds the missing platform folders in place
      # without touching lib/ or pubspec.yaml.
      - name: Scaffold platform folders
        run: flutter create --platforms=android,ios --org com.zsmultitool .

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: multi-tool-remote-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold platform folders
        run: flutter create --platforms=android,ios --org com.zsmultitool .

      - run: flutter pub get

      # --no-codesign: no Apple Developer account or Mac needed. Produces
      # an unsigned Runner.app, which is exactly what jailbroken sideload
      # tools (AppSync Unified / TrollStore / Filza install) expect.
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      # Package Runner.app into a proper IPA: Payload/Runner.app zipped up.
      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/Runner.app
          zip -r MultiToolRemote-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: multi-tool-remote-ipa-unsigned
          path: build/ios/iphoneos/MultiToolRemote-unsigned.ipa
