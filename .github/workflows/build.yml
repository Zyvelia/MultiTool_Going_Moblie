name: Build Multi Tool Remote

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # This repo ships only lib/ + pubspec.yaml (no android/ios folders).
      # `flutter create .` scaffolds the missing platform folders in place
      # without touching lib/ or pubspec.yaml.
      - name: Scaffold platform folders
        run: flutter create --platforms=android,ios --org com.zsmultitool --no-pub .

      - name: Patch Android project (manifest, audio, compileSdk, Kotlin)
        run: python3 scripts/patch_android.py

      - run: flutter pub get

      # Regenerates android/app/src/main/res/mipmap-*/ic_launcher.png (and
      # adaptive icon layers) from assets/icon/icon.png. Needed every run
      # since android/ is scaffolded fresh above, not committed.
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: multi-tool-remote-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold platform folders
        run: flutter create --platforms=android,ios --org com.zsmultitool .

      # audio_service (Music tab) needs background audio mode declared in
      # Info.plist — ios/ is scaffolded fresh every run.
      - name: Patch Info.plist for background audio
        run: |
          python3 - <<'PY'
          path = "ios/Runner/Info.plist"
          with open(path) as f:
              plist = f.read()

          block = (
              "\t<key>UIBackgroundModes</key>\n"
              "\t<array>\n"
              "\t\t<string>audio</string>\n"
              "\t</array>\n"
          )
          plist = plist.replace("<dict>\n", "<dict>\n" + block, 1)

          with open(path, "w") as f:
              f.write(plist)
          print("Patched Info.plist for background audio")
          PY

      # AirPrint / Bonjour for the Notes print button (printing package).
      - name: Patch Info.plist for AirPrint discovery
        run: |
          python3 - <<'PY'
          path = "ios/Runner/Info.plist"
          with open(path) as f:
              plist = f.read()

          block = (
              "\t<key>NSLocalNetworkUsageDescription</key>\n"
              "\t<string>Used to find printers on your Wi-Fi network so notes can be printed.</string>\n"
              "\t<key>NSBonjourServices</key>\n"
              "\t<array>\n"
              "\t\t<string>_ipp._tcp</string>\n"
              "\t\t<string>_ipps._tcp</string>\n"
              "\t</array>\n"
          )
          plist = plist.replace("<dict>\n", "<dict>\n" + block, 1)

          with open(path, "w") as f:
              f.write(plist)
          print("Patched Info.plist for AirPrint discovery")
          PY

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # Do NOT use `flutter build ios` — newer stable runs xcodebuild fine but
      # then fails the Apple-team pre-check and never copies Runner.app.
      # xcodebuild direct + signing disabled is the reliable unsigned path.
      - name: Patch iOS for unsigned build
        run: python3 scripts/patch_ios_unsigned.py

      - name: Install pods
        run: cd ios && pod install

      - name: Build iOS with xcodebuild (unsigned)
        run: |
          set +e
          # Clear macOS provenance xattrs — can break codesign on CI runners.
          xattr -cr . 2>/dev/null || true

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            EXPANDED_CODE_SIGN_IDENTITY="-" \
            build 2>&1 | tee xcodebuild.log
          XCODE_EXIT=${PIPESTATUS[0]}

          APP="build/ios-derived/Build/Products/Release-iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "xcodebuild failed with no Runner.app (exit ${XCODE_EXIT})"
            grep -E 'error:|fatal error:|BUILD FAILED' xcodebuild.log | tail -40 || true
            exit "${XCODE_EXIT:-1}"
          fi

          echo "Runner.app present after xcodebuild (exit ${XCODE_EXIT})"
          chmod +x scripts/finalize_ios_bundle.sh
          scripts/finalize_ios_bundle.sh "$APP"

          if [ ! -f "$APP/Info.plist" ]; then
            echo "ERROR: Info.plist still missing inside Runner.app"
            exit 1
          fi

          mkdir -p build/ios/iphoneos
          rsync -a "$APP/" build/ios/iphoneos/Runner.app/
          echo "Bundled Runner.app with Info.plist OK"

      - name: Package IPA
        run: |
          APP="build/ios/iphoneos/Runner.app"
          test -f "$APP/Info.plist" || { echo "Refusing to package IPA without Info.plist"; exit 1; }
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app
          zip -r MultiToolRemote-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: multi-tool-remote-ipa-unsigned
          path: build/ios/iphoneos/MultiToolRemote-unsigned.ipa
