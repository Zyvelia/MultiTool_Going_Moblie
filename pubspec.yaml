name: multi_tool_remote
description: Unified remote for Zs Multi Tool - Vault, Gaming Hub, Soundboard, YouTube Downloader.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  share_plus: ^12.0.0
  path_provider: ^2.1.4
  file_picker: ^10.3.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # Source icon has transparency baked in (dark glow background), so this
  # is fine for Android adaptive icons and iOS (iOS ignores alpha anyway —
  # flutter_launcher_icons flattens it onto a solid background automatically).
  remove_alpha_ios: true
