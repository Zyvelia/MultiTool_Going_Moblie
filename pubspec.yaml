name: multi_tool_remote
description: Unified remote for Zs Multi Tool - Vault, Gaming Hub, YouTube Downloader.
publish_to: 'none'
version: 2.5.0+2

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^11.0.0
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  just_audio_background: ^0.0.1-beta.17
  share_plus: ^13.2.0
  path_provider: ^2.1.4
  file_picker: ^12.0.0
  connectivity_plus: ^6.1.3
  printing: ^5.13.4
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # Fully opaque square (badge on solid black), so no alpha-flattening
  # needed for iOS and no clipping risk on Android's round icon mask.
